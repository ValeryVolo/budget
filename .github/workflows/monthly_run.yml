name: Monthly Budget Sync

on:
  schedule:
    # Runs at 10:00 on the 12st of every month
    - cron: '0 10 12 * *'
  # This allows you to click the "Run workflow" button manually for testing
  workflow_dispatch:

jobs:
  run-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install pandas requests; fi

      - name: Run Script
        run: python main.py

      - name: Archive processed CSV
        # This saves your CSV so you can download it from the GitHub Actions tab
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: processed-budget-csv
          path: "*.csv"
          retention-days: 30

      - name: Archive log file
        # Save the detailed log for debugging
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: budget-sync-logs
          path: "budget_sync.log"
          retention-days: 30

      - name: Print logs on failure
        # Display logs in workflow summary if script fails
        if: failure()
        run: |
          echo "## ❌ Budget Sync Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Log Output:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ -f budget_sync.log ]; then
            cat budget_sync.log >> $GITHUB_STEP_SUMMARY
          else
            echo "Log file not found" >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY
